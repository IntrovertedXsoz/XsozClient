name: CI

# XsozClient - build gate.
#
# Scope note: this workflow builds and tests the PURE-JAVA half of the product only
# (`:core` and `:platform-api`). The full matrix - JDK 8 for the 1.8.9 pole, JDK 21 for
# the 1.21.11 pole, JDK 25 for the modern pole - arrives with the platform modules, which
# bring Fabric Loom and real Minecraft dependencies.
#
# When it does, use `windows-2025` rather than `windows-latest`: the windows-2025 image
# already ships JDK 8, 11, 17, 21 and 25 preinstalled, so the toolchain jobs cost nothing
# extra. See docs/toolchain.md section 8, landmine 2.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit test (pure-Java core)
    runs-on: windows-2025

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      # The wrapper is committed, including gradle-wrapper.jar. Never bootstrap Gradle
      # from a global install in CI; the wrapper IS the pinned version.
      - name: Show Gradle version
        run: ./gradlew --version

      - name: Build and test
        run: ./gradlew build --stacktrace

      # Same architectural rule as :core:verifyNoForbiddenGameReferences, invoked on its
      # own so a violation is legible in the job summary rather than buried in a
      # compilation failure.
      - name: Assert core has zero game imports (contract C10.3)
        run: ./gradlew :core:c10Clean

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Placeholder for the matrix that lands with the platform modules:
  #
  #   build-jdk8   -> :platform-1.8.9   (Legacy Fabric 0.19.3, JDK 8 toolchain)
  #   build-jdk21  -> :platform-1.21.11 (Fabric 0.19.5, JDK 21 toolchain)
  #   build-jdk25  -> the 26.x pole    (Fabric 0.19.5, unobfuscated, JDK 25)
  #
  # foojay-resolver-convention is already applied in settings.gradle.kts, so those jobs
  # need no pre-installed JDK at all - the toolchain provisions itself.
  # ---------------------------------------------------------------------------
